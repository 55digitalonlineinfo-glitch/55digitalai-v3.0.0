:root{
  --bg:#0B0F0D; --panel:#121715; --panel-alt:#141A18; --border:#222B27;
  --text:#E6EFE9; --text-dim:#87A094; --text-faint:#6E837A;
  --accent:#18DC49; --accent-soft:#122B1A;
  --good:#22C38D; --good-bg:#10251C;
  --warn:#F5A83D; --warn-bg:#2B2112;
  --crit:#EF4343; --crit-bg:#2A1414;
  --radius:8px; --chip-radius:20px;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:'JetBrains Mono',ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --shadow-1:0 1px 2px rgba(0,0,0,.4), 0 1px 3px rgba(0,0,0,.3);
  --shadow-2:0 2px 6px rgba(0,0,0,.5), 0 4px 14px rgba(0,0,0,.3);
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#F4F9F6; --panel:#FFFFFF; --panel-alt:#EAF3EE; --border:#D3E3DA;
    --text:#10201A; --text-dim:#4F6259; --text-faint:#7C8F85;
    --accent:#0F8A3E; --accent-soft:#E3F5EA;
    --good:#0E8F73; --good-bg:#E1F3EC;
    --warn:#B5750A; --warn-bg:#FBEEDA;
    --crit:#C62C2C; --crit-bg:#FBE3E3;
    --shadow-1:0 1px 2px rgba(16,32,26,.12), 0 1px 3px rgba(16,32,26,.08);
    --shadow-2:0 2px 6px rgba(16,32,26,.14), 0 4px 14px rgba(16,32,26,.08);
  }
}
:root[data-theme="dark"]{
  --bg:#0B0F0D; --panel:#121715; --panel-alt:#141A18; --border:#222B27;
  --text:#E6EFE9; --text-dim:#87A094; --text-faint:#6E837A;
  --accent:#18DC49; --accent-soft:#122B1A;
  --good:#22C38D; --good-bg:#10251C;
  --warn:#F5A83D; --warn-bg:#2B2112;
  --crit:#EF4343; --crit-bg:#2A1414;
  --shadow-1:0 1px 2px rgba(0,0,0,.4), 0 1px 3px rgba(0,0,0,.3);
  --shadow-2:0 2px 6px rgba(0,0,0,.5), 0 4px 14px rgba(0,0,0,.3);
}
:root[data-theme="light"]{
  --bg:#F4F9F6; --panel:#FFFFFF; --panel-alt:#EAF3EE; --border:#D3E3DA;
  --text:#10201A; --text-dim:#4F6259; --text-faint:#7C8F85;
  --accent:#0F8A3E; --accent-soft:#E3F5EA;
  --good:#0E8F73; --good-bg:#E1F3EC;
  --warn:#B5750A; --warn-bg:#FBEEDA;
  --crit:#C62C2C; --crit-bg:#FBE3E3;
  --shadow-1:0 1px 2px rgba(16,32,26,.12), 0 1px 3px rgba(16,32,26,.08);
  --shadow-2:0 2px 6px rgba(16,32,26,.14), 0 4px 14px rgba(16,32,26,.08);
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);}
body{display:flex;flex-direction:column;font-size:13.5px;line-height:1.5;}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }
button{font-family:inherit;cursor:pointer;}

.appbar{display:flex;align-items:center;gap:16px;padding:8px 18px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0;}
.menu-toggle{display:none;font-size:16px;border:1px solid var(--border);background:var(--panel-alt);border-radius:8px;padding:6px 10px;color:var(--text-dim);flex-shrink:0;}
.logo{width:26px;height:26px;border-radius:6px;flex-shrink:0;object-fit:contain;}
.brand{font-weight:500;font-size:15px;color:var(--text);}
.brand small{display:block;font-weight:400;color:var(--text-faint);font-size:10.5px;}
.omnibox{flex:1;min-width:0;max-width:480px;display:flex;align-items:center;gap:8px;background:var(--panel-alt);border-radius:24px;padding:8px 16px;color:var(--text-faint);font-size:13px;border:1px solid transparent;transition:box-shadow .15s,background .15s;}
.omnibox:focus-within{background:var(--panel);box-shadow:var(--shadow-1);border-color:var(--border);}
.omnibox input{border:none;background:none;outline:none;color:var(--text);font-size:13px;flex:1;min-width:0;font-family:inherit;}
.theme-toggle{margin-left:auto;font-size:11px;border:1px solid var(--border);background:var(--panel-alt);border-radius:16px;padding:6px 12px;color:var(--text-dim);flex-shrink:0;transition:background .15s;}
.theme-toggle:hover{background:var(--accent-soft);color:var(--accent);}

.layout{display:flex;flex:1;min-height:0;}
.sidebar{width:250px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:10px 8px;}
.nav-label{font-size:10.5px;font-weight:600;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;padding:10px 12px 6px;}
.client-list{overflow-y:auto;flex:1;}
.client-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:0 20px 20px 0;cursor:pointer;position:relative;transition:background .12s;margin-bottom:1px;}
.client-item:hover{background:var(--panel-alt);}
.client-item.active{background:var(--accent-soft);}
.client-item.active::before{content:"";position:absolute;left:-8px;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--accent);}
.avatar{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;flex-shrink:0;}
.client-item .ci-name{font-weight:500;font-size:12.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.client-item.active .ci-name{color:var(--accent);}
.client-item .ci-badge{margin-left:auto;font-size:10.5px;color:var(--text-faint);font-variant-numeric:tabular-nums;}
.sidebar-backdrop{display:none;}

.main{flex:1;overflow-y:auto;min-width:0;}
.home{padding:24px 28px 40px;max-width:1160px;margin:0 auto;}
.home h1{font-size:18px;margin:0 0 3px;font-weight:500;}
.home p.sub{color:var(--text-faint);margin:0 0 20px;font-size:12.5px;}

.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px;}
.kpi-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow-1);transition:box-shadow .15s,transform .15s;}
.kpi-card:hover{box-shadow:var(--shadow-2);transform:translateY(-1px);}
.kpi-label{font-size:11px;color:var(--text-dim);margin-bottom:6px;}
.kpi-value-row{display:flex;align-items:baseline;justify-content:space-between;}
.kpi-value{font-size:24px;font-weight:500;letter-spacing:-.01em;}
.kpi-delta{font-size:11px;font-weight:600;display:flex;align-items:center;gap:2px;color:var(--text-faint);}
.kpi-delta.up{color:var(--good);} .kpi-delta.down{color:var(--crit);}
.kpi-spark{margin-top:8px;height:28px;}

.section-title{font-size:13px;font-weight:600;margin:0 0 12px;color:var(--text);}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
.client-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;cursor:pointer;box-shadow:var(--shadow-1);transition:box-shadow .15s,transform .15s;}
.client-card:hover{box-shadow:var(--shadow-2);transform:translateY(-2px);}
.cc-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.cc-head .avatar{width:34px;height:34px;font-size:13px;}
.client-card h3{margin:0;font-size:13.5px;font-weight:500;}
.client-card .dom{color:var(--text-faint);font-size:11px;}
.client-card .row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-dim);margin-top:6px;}
.client-card .row b{color:var(--text);font-weight:600;}
.status-chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:3px 10px 3px 8px;border-radius:var(--chip-radius);flex-shrink:0;}
.status-chip .sdot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.status-chip.good{background:var(--good-bg);color:var(--good);} .status-chip.good .sdot{background:var(--good);}
.status-chip.warn{background:var(--warn-bg);color:#7a5900;} .status-chip.warn .sdot{background:var(--warn);}
@media (prefers-color-scheme: dark){ .status-chip.warn{color:var(--warn);} }
:root[data-theme="dark"] .status-chip.warn{color:var(--warn);}
.status-chip.crit{background:var(--crit-bg);color:var(--crit);} .status-chip.crit .sdot{background:var(--crit);}
.status-chip.na{background:var(--panel-alt);color:var(--text-faint);} .status-chip.na .sdot{background:var(--text-faint);}

/* pulse check — budget meter + conversion flags */
.cc-pulse{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.meter-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text-dim);margin-bottom:4px;}
.meter-label b{color:var(--text);font-weight:600;}
.meter-track{position:relative;height:6px;border-radius:3px;background:var(--panel-alt);overflow:visible;}
.meter-fill{height:100%;border-radius:3px;transition:width .2s;}
.meter-fill.good{background:var(--good);} .meter-fill.warn{background:var(--warn);} .meter-fill.crit{background:var(--crit);}
.meter-tick{position:absolute;top:-2px;width:2px;height:10px;background:var(--text-faint);border-radius:1px;}
.cc-conv-row{display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--text-dim);}
.pulse-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-1);margin-bottom:16px;}
.pulse-card h4{margin:0 0 12px;font-size:13px;font-weight:600;}
.pulse-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media (max-width:760px){
  .pulse-grid{grid-template-columns:1fr;}
  .menu-toggle{display:block;}
  .appbar{gap:10px;padding:8px 12px;}
  .brand small{display:none;}
  .theme-toggle{padding:6px 9px;font-size:10px;}
  .layout{position:relative;overflow:hidden;}
  .sidebar{position:fixed;top:0;left:0;height:100%;z-index:50;transform:translateX(-100%);transition:transform .2s ease;box-shadow:var(--shadow-1);}
  .sidebar.open{transform:translateX(0);}
  .sidebar-backdrop.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:49;}
  .kpi-row{grid-template-columns:repeat(2,1fr);}
  .home{padding:16px 14px 32px;}
  .detail-head{padding:14px 16px;}
  .tab-body{padding:16px 14px 36px;}
  .tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .tab{white-space:nowrap;}
}
@media (max-width:480px){
  .kpi-row{grid-template-columns:1fr;}
  .report-row{flex-wrap:wrap;gap:6px 10px;}
  .report-row .type-tag{order:1;}
  .report-row .report-date{order:2;width:auto;}
  .report-row .report-file{order:3;flex-basis:100%;}
  .report-row .neg-count{order:4;}
  .report-row .status-chip{order:5;margin-left:auto;}
}
.pulse-meter-big .meter-track{height:10px;border-radius:5px;}
.pulse-meter-big .meter-tick{height:16px;top:-3px;}
.pulse-meter-big .meter-nums{display:flex;justify-content:space-between;margin-top:6px;font-size:11.5px;color:var(--text-dim);}
.pulse-meter-big .meter-nums b{color:var(--text);}
.pulse-sub{font-size:11px;color:var(--text-faint);margin-top:4px;}
.pulse-charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:16px;}
.pulse-chart-card{margin-bottom:0;}
.conv-flag-row{padding:8px 0;border-bottom:1px solid var(--border);font-size:12px;}
.conv-flag-row:last-child{border-bottom:none;}
.conv-flag-row .cf-campaign{font-weight:600;color:var(--text);display:flex;align-items:center;gap:6px;}
.conv-flag-row .cf-msg{color:var(--text-dim);margin-top:2px;}
.conv-flag-empty{color:var(--text-faint);font-size:12px;}

.detail-head{padding:18px 28px;border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:0;z-index:2;}
.crumb{font-size:11.5px;color:var(--accent);cursor:pointer;margin-bottom:8px;font-weight:500;}
.dh-title{display:flex;align-items:center;gap:12px;}
.dh-title .avatar{width:36px;height:36px;font-size:14px;}
.detail-head h1{margin:0 0 2px;font-size:16px;font-weight:500;}
.detail-head .sub{font-size:11.5px;color:var(--text-faint);}
.tabs{display:flex;gap:4px;margin-top:16px;}
.tab{padding:8px 16px;font-size:12.5px;font-weight:500;color:var(--text-dim);cursor:pointer;border-radius:var(--chip-radius);transition:background .12s;}
.tab:hover{background:var(--panel-alt);}
.tab.active{color:var(--accent);background:var(--accent-soft);}
.tab-body{padding:22px 28px 44px;max-width:1000px;}
.quick-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
.link-chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:5px 12px;border-radius:var(--chip-radius);border:1px solid var(--border);background:var(--panel);color:var(--text-dim);text-decoration:none;transition:background .12s,border-color .12s,color .12s;}
.link-chip:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}

.chart-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:20px;box-shadow:var(--shadow-1);}
.chart-card h4{margin:0 0 2px;font-size:12.5px;font-weight:600;}
.chart-card .cc-sub{font-size:11px;color:var(--text-faint);margin-bottom:10px;}

.md h1{font-size:16px;} .md h2{font-size:13px;margin-top:20px;font-weight:600;border-bottom:1px solid var(--border);padding-bottom:6px;}
.md h3{font-size:12.5px;margin-top:14px;color:var(--text-dim);} .md ul{margin:6px 0;padding-left:18px;} .md li{margin:3px 0;}
.md p{margin:8px 0;} .md strong{color:var(--text);} .md hr{border:none;border-top:1px solid var(--border);margin:16px 0;}
.md code{background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:1px 5px;font-family:var(--mono);font-size:12px;}

.filter-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
.chip{font-size:11.5px;font-weight:500;padding:6px 14px;border-radius:var(--chip-radius);border:1px solid var(--border);background:var(--panel);color:var(--text-dim);transition:background .12s,border-color .12s;}
.chip:hover{background:var(--panel-alt);}
.chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
.report-search{flex:1;min-width:160px;padding:7px 14px;border-radius:var(--chip-radius);border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:12.5px;}
.report-search:focus{outline:none;border-color:var(--accent);}

.report-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:7px;background:var(--panel);cursor:pointer;transition:box-shadow .12s,border-color .12s;max-width:100%;}
.report-row:hover{box-shadow:var(--shadow-1);border-color:var(--accent);}
.report-date{font-size:12px;font-weight:600;white-space:nowrap;width:78px;flex-shrink:0;}
.report-file{font-size:11px;color:var(--text-faint);font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;}
.type-tag{font-size:10px;color:var(--text-dim);background:var(--panel-alt);padding:2px 8px;border-radius:10px;white-space:nowrap;flex-shrink:0;}
.neg-count{font-size:11px;color:var(--text-faint);white-space:nowrap;flex-shrink:0;}

.log-view{background:var(--panel-alt);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);padding:16px 18px;font-family:var(--mono);font-size:12px;line-height:1.7;overflow-x:auto;white-space:pre-wrap;word-break:break-word;}
.log-view .neg{color:var(--crit);font-weight:600;} .log-view .keep{color:var(--good);font-weight:600;} .log-view .head{color:var(--text-faint);font-weight:600;}
.log-view .info{color:var(--accent);}
.log-back{font-size:11.5px;color:var(--accent);cursor:pointer;margin-bottom:10px;display:inline-block;font-weight:500;}

.script-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:13px 16px;margin-bottom:9px;box-shadow:var(--shadow-1);}
.script-card .sname{font-family:var(--mono);font-size:12px;font-weight:600;display:flex;align-items:center;gap:8px;}
.ext-badge{font-size:9.5px;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:1px 7px;font-weight:600;}
.script-card .shead{margin-top:6px;font-size:11.5px;color:var(--text-dim);white-space:pre-wrap;}
.copy-btn{margin-left:auto;font-size:10.5px;background:none;border:1px solid var(--border);border-radius:12px;padding:3px 10px;color:var(--text-dim);}
.copy-btn:hover{border-color:var(--accent);color:var(--accent);}
.empty{color:var(--text-faint);font-size:12.5px;padding:26px 0;text-align:center;}

.bar-chart{width:100%;overflow:visible;}
.bar-chart .bar{fill:var(--accent);cursor:pointer;transition:fill .1s;}
.bar-chart .bar:hover{fill:var(--good);}
.bar-chart .baseline{stroke:var(--border);stroke-width:1;}
.bar-chart .cap-label{font-size:10px;fill:var(--text-dim);font-family:var(--sans);}
.bar-chart .x-label{font-size:9.5px;fill:var(--text-faint);font-family:var(--sans);}
.spark-line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.spark-area{fill:var(--accent);opacity:.10;}
.spark-dot{fill:var(--accent);stroke:var(--panel);stroke-width:2;}
.chart-tooltip{position:fixed;pointer-events:none;background:var(--text);color:var(--bg);font-size:11px;padding:6px 10px;border-radius:6px;z-index:50;box-shadow:var(--shadow-2);opacity:0;transition:opacity .08s;white-space:nowrap;}
.chart-tooltip .val{font-weight:700;} .chart-tooltip .lbl{color:var(--text-faint);margin-top:1px;}
</style>
</head>

<script>
const DATA = JSON.parse(document.getElementById('dashboard-data').textContent);
const NOW = DATA.generated_at ? new Date(DATA.generated_at) : new Date();
const AVATAR_COLORS = ["#1a73e8","#d93025","#1e8e3e","#f9ab00"];
function avatarColor(slug){ let h=0; for(const c of slug) h=(h*31+c.charCodeAt(0))>>>0; return AVATAR_COLORS[h % AVATAR_COLORS.length]; }
function initials(name){ return name.split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
let currentSlug=null, currentTab='overview';

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function md(t){
  const lines=t.split('\n');let html='';let inList=false;
  const closeList=()=>{if(inList){html+='</ul>';inList=false;}};
  const inline=(s)=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');
  for(const raw of lines){
    const line=raw.replace(/\r$/,'');
    if(/^\s*---+\s*$/.test(line)){closeList();html+='<hr>';continue;}
    let m;
    if((m=line.match(/^(#{1,4})\s+(.*)$/))){closeList();const l=Math.min(m[1].length,3);html+=`<h${l}>${inline(m[2])}</h${l}>`;continue;}
    if((m=line.match(/^\s*[-*]\s+(.*)$/))){if(!inList){html+='<ul>';inList=true;}html+=`<li>${inline(m[1])}</li>`;continue;}
    if((m=line.match(/^\s*\d+\.\s+(.*)$/))){if(!inList){html+='<ul>';inList=true;}html+=`<li>${inline(m[1])}</li>`;continue;}
    if(line.trim()===''){closeList();continue;}
    closeList();html+=`<p>${inline(line)}</p>`;
  }
  closeList();return html;
}
function highlightLog(t){
  return esc(t).split('\n').map(l=>{
    if(/^\s*\[NEGATE(D)?\]/.test(l))return `<span class="neg">${l}</span>`;
    if(/^\s*\[KEPT\]/.test(l))return `<span class="keep">${l}</span>`;
    if(/^\s*\[FLAG\]/.test(l))return `<span class="neg">${l}</span>`;
    if(/^\s*\[OK\]/.test(l))return `<span class="keep">${l}</span>`;
    if(/^\s*\[INFO\]/.test(l))return `<span class="info">${l}</span>`;
    if(/^═+/.test(l)||/^##\s/.test(l))return `<span class="head">${l}</span>`;
    return l;
  }).join('\n');
}
function fmtBytes(n){return n<1024?n+' B':(n/1024).toFixed(1)+' KB';}

/* ---------- real historical aggregation (no fabricated numbers) ---------- */
const REPORTS = DATA.clients.flatMap(c => c.reports.map(r => ({...r, clientSlug:c.slug})));
function daysAgo(dateStr){ return (NOW - new Date(dateStr+'T00:00:00')) / 86400000; }
function windowReports(startAgo, endAgo){ return REPORTS.filter(r=>{ const a=daysAgo(r.date); return a>=startAgo && a<endAgo; }); }
function sum(arr, fn){ return arr.reduce((s,x)=>s+fn(x),0); }
function cleanRate(arr){ if(!arr.length) return null; return Math.round(arr.filter(r=>!(r.stats.negated>0)).length/arr.length*100); }
function dailyBuckets(days){
  const buckets=[];
  for(let i=days-1;i>=0;i--){ const d=new Date(NOW); d.setDate(d.getDate()-i); buckets.push({date:d.toISOString().slice(0,10), reports:0, negated:0}); }
  const map=Object.fromEntries(buckets.map(b=>[b.date,b]));
  REPORTS.forEach(r=>{ if(map[r.date]){ map[r.date].reports++; map[r.date].negated+=(r.stats.negated||0);} });
  return buckets;
}

/* ---------- tooltip ---------- */
const tip = document.getElementById('tooltip');
function showTip(evt,valueText,labelText){
  tip.querySelector('.val').textContent = valueText;
  tip.querySelector('.lbl').textContent = labelText;
  tip.style.opacity = 1;
  const x = evt.clientX, y = evt.clientY;
  tip.style.left = Math.min(x+12, window.innerWidth-160) + 'px';
  tip.style.top = (y-38) + 'px';
}
function hideTip(){ tip.style.opacity = 0; }

function renderSparkline(container, values){
  const w=110,h=28,pad=3;
  const max=Math.max(...values,1), min=0;
  const step = (w-pad*2)/(values.length-1||1);
  const pts = values.map((v,i)=>[pad+i*step, h-pad-((v-min)/(max-min||1))*(h-pad*2)]);
  const line = pts.map(p=>p.join(',')).join(' ');
  const area = `${pad},${h-pad} ${line} ${w-pad},${h-pad}`;
  const [ex,ey] = pts[pts.length-1];
  container.innerHTML = `<svg class="bar-chart" viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">
    <polygon class="spark-area" points="${area}"></polygon>
    <polyline class="spark-line" points="${line}"></polyline>
    <circle class="spark-dot" cx="${ex}" cy="${ey}" r="3.5"></circle>
  </svg>`;
}
function renderBarChart(container, points, opts){
  opts = opts || {};
  const unit = opts.unit !== undefined ? opts.unit : 'negated';
  const decimals = opts.decimals !== undefined ? opts.decimals : 0;
  const emptyMsg = opts.emptyMsg || 'No automated audit history yet.';
  if(!points.length){ container.innerHTML = `<div class="empty">${emptyMsg}</div>`; return; }
  const n=points.length;
  const w=560,h=140,padL=8,padR=8,padT=10,padB=24,barGap=n>15?2:10;
  const max=Math.max(...points.map(p=>p.v),1);
  const barW=Math.min(24,(w-padL-padR-barGap*(n-1))/n);
  const totalW=barW*n+barGap*(n-1);
  const startX=(w-totalW)/2;
  const baseY=h-padB;
  const showCapLabels = n<=12;
  const labelEvery = n<=10 ? 1 : Math.ceil(n/8);
  let svg=`<svg class="bar-chart" viewBox="0 0 ${w} ${h}" width="100%" height="${h}">`;
  svg+=`<line class="baseline" x1="${padL}" y1="${baseY}" x2="${w-padR}" y2="${baseY}"></line>`;
  points.forEach((p,i)=>{
    const x=startX+i*(barW+barGap);
    const barH=(p.v/max)*(h-padT-padB-14);
    const y=baseY-barH;
    const vLabel=p.v.toFixed(decimals);
    svg+=`<rect class="bar" data-v="${vLabel}" data-l="${esc(p.label)}" x="${x}" y="${y}" width="${barW}" height="${Math.max(barH,1)}" rx="4"></rect>`;
    if(showCapLabels) svg+=`<text class="cap-label" x="${x+barW/2}" y="${y-5}" text-anchor="middle">${vLabel}</text>`;
    if(i%labelEvery===0 || i===n-1) svg+=`<text class="x-label" x="${x+barW/2}" y="${h-8}" text-anchor="middle">${esc(p.label)}</text>`;
  });
  svg+=`</svg>`;
  container.innerHTML=svg;
  container.querySelectorAll('.bar').forEach(bar=>{
    bar.addEventListener('pointermove',e=>showTip(e, bar.dataset.v+(unit?' '+unit:''), bar.dataset.l));
    bar.addEventListener('pointerleave',hideTip);
  });
}

/* ---------- pulse check: budget pacing meter + conversion flags ---------- */
function budgetMeterClass(budget){
  if(!budget || budget.status==='unconfigured') return 'na';
  if(budget.status==='ok') return 'good';
  return budget.direction==='over-pacing' ? 'crit' : 'warn';
}
function budgetMeterHtml(budget, big){
  if(!budget || budget.status==='unconfigured'){
    const msg = `<div class="conv-flag-empty">No monthly budget configured for this client.</div>`;
    return big ? msg : `<div class="cc-pulse">${msg}</div>`;
  }
  const cls = budgetMeterClass(budget);
  const fillPct = Math.min(budget.actual_pct, 100);
  const tickPct = Math.min(budget.expected_pct, 100);
  const track = `<div class="meter-track"><div class="meter-fill ${cls}" style="width:${fillPct}%"></div><div class="meter-tick" style="left:${tickPct}%"></div></div>`;
  if(big){
    return `<div class="pulse-meter-big">
      <div class="meter-label"><span>Monthly budget pacing</span><b>${budget.actual_pct}% used</b></div>
      ${track}
      <div class="meter-nums"><span><b>${budget.mtd_spend.toLocaleString()}</b> / ${budget.monthly_budget.toLocaleString()} ${budget.currency}</span><span>expected ~${budget.expected_pct}% (${budget.days_elapsed}/${budget.days_total}d elapsed)</span></div>
      ${paceRecommendationHtml(budget)}
    </div>`;
  }
  return `<div class="cc-pulse"><div class="meter-label"><span>Budget (MTD)</span><b>${budget.actual_pct}%</b></div>${track}</div>`;
}
function paceRecommendationHtml(budget){
  const rec = budget.pace_recommendation;
  if(!rec) return '';
  const cur = budget.currency;
  if(rec.type === 'over_budget'){
    return `<div class="pulse-sub" style="margin-top:8px;color:var(--crit);">Already <b>${rec.over_amount.toLocaleString()} ${cur}</b> over budget with ${rec.remaining_days}d left — consider pausing or cutting daily spend.</div>`;
  }
  if(rec.type === 'last_day'){
    return `<div class="pulse-sub" style="margin-top:8px;">Last day of the month — spend will land at the current MTD total.</div>`;
  }
  const verb = rec.direction === 'increase' ? 'Increase' : 'Decrease';
  return `<div class="pulse-sub" style="margin-top:8px;">To hit budget: spend ~<b style="color:var(--text);">${rec.required_daily.toLocaleString()} ${cur}/day</b> for the remaining ${rec.remaining_days}d
    (yesterday spent ${rec.yesterday_spend.toLocaleString()} ${cur} → ${verb} daily spend by <b style="color:var(--text);">${rec.delta.toLocaleString()} ${cur}/day</b>).</div>`;
}
function convFlagsChip(pulse){
  if(!pulse) return `<span class="status-chip na"><span class="sdot"></span>No pulse check</span>`;
  const n = pulse.conversion_flags.length;
  if(n===0) return `<span class="status-chip good"><span class="sdot"></span>Conversions OK</span>`;
  return `<span class="status-chip crit"><span class="sdot"></span>${n} conv. flag${n>1?'s':''}</span>`;
}
function pulseFreshnessChip(c){
  if(!c.pulse || !c.pulse.date) return `<span class="status-chip warn"><span class="sdot"></span>No pulse-check on record</span>`;
  const days = Math.floor((NOW - new Date(c.pulse.date+'T00:00:00')) / 86400000);
  if(days<=1) return `<span class="status-chip good"><span class="sdot"></span>Up to date</span>`;
  return `<span class="status-chip warn"><span class="sdot"></span>${days}d since last check</span>`;
}
function pulseCardHtml(c){
  const p = c.pulse;
  if(!p) return `<div class="pulse-card"><h4>Pulse Check</h4><div class="pulse-sub" style="margin-bottom:8px;">${pulseFreshnessChip(c)}</div><div class="conv-flag-empty">No pulse-check on record for this client yet.</div></div>`;
  const flagsHtml = p.conversion_flags.length

    : `<div class="conv-flag-empty">No conversion anomalies in the latest check.</div>`;
  const chartsHtml = c.business_type === 'ecommerce'
    ? `<div class="pulse-charts">
        <div class="chart-card pulse-chart-card"><h4>Conversion value by day (MTD)</h4><div class="cc-sub">Excludes today (partial day)</div><div id="pulse-chart-value"></div></div>
        <div class="chart-card pulse-chart-card"><h4>ROAS by day (MTD)</h4><div class="cc-sub">Conversion value ÷ cost</div><div id="pulse-chart-roas"></div></div>
      </div>`
    : `<div class="pulse-charts">
        <div class="chart-card pulse-chart-card"><h4>Conversions by day (MTD)</h4><div class="cc-sub">Excludes today (partial day)</div><div id="pulse-chart-conv"></div></div>
      </div>`;
  return `<div class="pulse-card"><h4>Pulse Check — ${p.date}</h4>
    <div class="pulse-sub" style="margin-bottom:10px;">${pulseFreshnessChip(c)}</div>
    <div class="pulse-grid">
      <div>${budgetMeterHtml(p.budget, true)}</div>
      <div><div class="meter-label"><span>Conversion tracking</span></div>${flagsHtml}</div>
    </div>
    ${p.trend && p.trend.length ? chartsHtml : ''}
    <div class="pulse-sub">Last run ${p.run_at.replace('T',' ')} · ${p.total_flags!==null?p.total_flags+' total flag'+(p.total_flags===1?'':'s')+' this run':''}</div>
  </div>`;
}
function renderPulseCharts(c){
  const p = c.pulse;
  if(!p || !p.trend || !p.trend.length) return;
  const currency = (p.budget && p.budget.currency) || '';
  if(c.business_type === 'ecommerce'){
    const valueEl = document.getElementById('pulse-chart-value');
    if(valueEl) renderBarChart(valueEl, p.trend.map(d=>({v:d.conv_value||0, label:d.date})), {unit:currency, decimals:0});
    const roasEl = document.getElementById('pulse-chart-roas');
    if(roasEl) renderBarChart(roasEl, p.trend.map(d=>({v:d.roas||0, label:d.date})), {unit:'ROAS', decimals:2});
  } else {
    const convEl = document.getElementById('pulse-chart-conv');
    if(convEl) renderBarChart(convEl, p.trend.map(d=>({v:d.conv||0, label:d.date})), {unit:'conv', decimals:1});
  }
}

function dcStatusChip(status, message){

/* ---------- month vs. month comparison ---------- */
function mcDelta(lastVal, thisVal){
  if(!lastVal) return null;
  const pct = (thisVal - lastVal) / Math.abs(lastVal) * 100;
  return {pct, dir: pct > 0 ? 'up' : (pct < 0 ? 'down' : null)};
}
function mcDeltaBadge(lastVal, thisVal, suffix){
  const d = mcDelta(lastVal, thisVal);
  if(!d) return `<span class="kpi-delta">no prior data</span>`;
  return `<span class="kpi-delta ${d.dir||''}">${d.dir==='up'?'▲ ':d.dir==='down'?'▼ ':''}${d.pct>=0?'+':''}${d.pct.toFixed(0)}%${suffix||''}</span>`;
}
function mcTile(label, lastVal, thisVal, fmt){
  return `<div class="kpi-card">
      <div class="kpi-label">${esc(label)}</div>
      <div class="kpi-value-row"><span class="kpi-value">${fmt(thisVal)}</span></div>
      <div class="pulse-sub" style="margin-top:2px;">${fmt(lastVal)} last month</div>
      ${mcDeltaBadge(lastVal, thisVal, ' vs. last month')}
    </div>`;
}
function monthComparisonHtml(c){
  const mc = c.pulse && c.pulse.month_comparison;
  if(!mc) return '';
  const cur = mc.currency || '';
  const money = v => `${v.toLocaleString(undefined,{maximumFractionDigits:0})} ${cur}`;
  let tiles;
  if(c.business_type === 'ecommerce'){
    tiles = mcTile('Cost', mc.last_cost, mc.this_cost, money)
      + mcTile('Revenue', mc.last_revenue, mc.this_revenue, money)
      + mcTile('ROAS', mc.last_roas||0, mc.this_roas||0, v=>v.toFixed(2));
  } else {
    tiles = mcTile('Cost', mc.last_cost, mc.this_cost, money)
      + mcTile('Conversions', mc.last_conversions||0, mc.this_conversions||0, v=>v.toFixed(0));
  }
  return `<div class="section-title" style="margin-top:20px;">Month vs. month (${mc.this_from} → ${mc.this_to} vs. ${mc.last_from} → ${mc.last_to})</div>
    <div class="kpi-row" style="margin-bottom:20px;">${tiles}</div>`;
}
function monthComparisonCardRows(c){
  const mc = c.pulse && c.pulse.month_comparison;
  if(!mc) return '';
  if(c.business_type === 'ecommerce'){
    return `<div class="row"><span>Cost (mo/mo)</span>${mcDeltaBadge(mc.last_cost, mc.this_cost)}</div>
      <div class="row"><span>Revenue (mo/mo)</span>${mcDeltaBadge(mc.last_revenue, mc.this_revenue)}</div>
      <div class="row"><span>ROAS (mo/mo)</span>${mcDeltaBadge(mc.last_roas||0, mc.this_roas||0)}</div>`;
  }
  return `<div class="row"><span>Cost (mo/mo)</span>${mcDeltaBadge(mc.last_cost, mc.this_cost)}</div>
    <div class="row"><span>Conversions (mo/mo)</span>${mcDeltaBadge(mc.last_conversions||0, mc.this_conversions||0)}</div>`;
}
const RECO_SEVERITY_ORDER = {high:0, medium:1, low:2};
const RECO_SEVERITY_CHIP = {high:'crit', medium:'warn', low:'na'};
function buildRecommendations(c){
  const p = c.pulse;
  const recos = [];
  if(!p) return recos;
  const h = p.header;
  const windowStr = h ? `${h.check_from} to ${h.check_to} (last ${h.check_days} days)` : 'the current check window';
  const currency = (p.budget && p.budget.currency) || '';

  if(p.budget && p.budget.status === 'flag'){
    const rec = p.budget.pace_recommendation;
    if(p.budget.direction === 'under-pacing'){
      const spendLine = (rec && rec.type === 'adjust')
        ? ` Raise daily spend to ~${rec.required_daily.toLocaleString()} ${currency}/day (yesterday spent ${rec.yesterday_spend.toLocaleString()} ${currency}/day) to land on budget by month-end.`
        : '';
      recos.push({severity:'medium', title:'Increase budget/daily spend to match pacing',
        detail:`Account is under-pacing: ${p.budget.actual_pct}% of monthly budget used vs. an expected ${p.budget.expected_pct}% (day ${p.budget.days_elapsed} of ${p.budget.days_total}).${spendLine}`});
    } else if(p.budget.direction === 'over-pacing'){
      const overLine = (rec && rec.type === 'over_budget')
        ? ` Already ${rec.over_amount.toLocaleString()} ${currency} over budget with ${rec.remaining_days} days left.`
        : '';
      recos.push({severity:'high', title:'Reduce daily spend — over-pacing',
        detail:`Account is over-pacing: ${p.budget.actual_pct}% of monthly budget used vs. an expected ${p.budget.expected_pct}%.${overLine} Cut daily spend, or raise the monthly budget if this pace is intentional.`});
    }
  }

  (p.budget_campaigns||[]).forEach(bc=>{
    recos.push({severity:'medium', title:`Consider a higher budget: ${bc.campaign}`,
      detail:`Losing ${bc.lost_is_pct}% of eligible impression share purely to budget limits over ${windowStr} — this campaign could capture more traffic if funded higher.`});
  });

  (p.conversion_campaigns||[]).filter(e=>e.status==='flag').forEach(e=>{
    const isDrop = e.message.startsWith('Dropped to zero');
    recos.push({severity: isDrop ? 'high' : 'medium',
      title: isDrop ? `Check conversion tracking: ${e.name}` : `Conversion volume down: ${e.name}`,
      detail: isDrop
        ? `Conversions dropped to zero over ${windowStr}, down from a prior ${h?h.baseline_days:''} days average of ${e.baseline_avg.toFixed(2)}/day. Check the conversion tag, recent campaign edits, and Ads UI diagnostics for this campaign first — this is the highest-priority signal in this report.`
        : `${e.message} Prior ${h?h.baseline_days:''} days average was ${e.baseline_avg.toFixed(2)} conv/day, down to ${e.check_avg.toFixed(2)} conv/day (${e.check_total} total) over ${windowStr}.`});
  });

  (p.cost_campaigns||[]).filter(e=>e.status==='flag').forEach(e=>{
    const isCostDown = /cost down/.test(e.message);
    const cpaLine = (e.baseline_cpa!==null && e.check_cpa!==null) ? ` CPA moved ${e.baseline_cpa.toFixed(2)} → ${e.check_cpa.toFixed(2)} ${currency}.` : '';
    recos.push({severity: isCostDown ? 'low' : 'medium',
      title: isCostDown ? `Spend dropped: ${e.name}` : `Efficiency declining: ${e.name}`,
      detail: isCostDown
        ? `Daily cost fell from ${e.baseline_cost.toFixed(2)} to ${e.check_cost.toFixed(2)} ${currency}/day over ${windowStr}. Check the Ads UI for disapproved ads or an exhausted budget, or confirm this was a deliberate change.`
        : `Daily cost moved ${e.baseline_cost.toFixed(2)} → ${e.check_cost.toFixed(2)} ${currency}/day over ${windowStr}.${cpaLine} Review recent bid-strategy or budget changes, and competitive pressure, for this campaign.`});
  });

  recos.sort((a,b)=>RECO_SEVERITY_ORDER[a.severity]-RECO_SEVERITY_ORDER[b.severity]);
  return recos;
}
function renderDailyCheckTab(c, body){
  const p = c.pulse;
  if(!p){
    body.innerHTML = `<div class="empty">No daily pulse-check has been run for this client yet.</div>`;
    return;
  }
  const h = p.header;
  const holidayHtml = p.holiday_note ? `<div class="pulse-sub" style="margin-top:6px;color:var(--warn);">${esc(p.holiday_note)}</div>` : '';
  const headerHtml = `<div class="pulse-card">

      ${h ? `<div class="pulse-sub" style="margin-top:6px;">Check window <b>${h.check_from} → ${h.check_to}</b> (${h.check_days}d) vs. baseline <b>${h.baseline_from} → ${h.baseline_to}</b> (${h.baseline_days}d)</div>` : ''}
      ${holidayHtml}
    </div>`;

  const convRows = (p.conversion_campaigns||[]).map(e=>{

  }).join('') || `<div class="conv-flag-empty">No campaign data.</div>`;
  const sec1Html = `<div class="chart-card">
      <h4>1. Conversion Tracking</h4>

  const budgetCampaignsHtml = (p.budget_campaigns||[]).length
    ? p.budget_campaigns.map(bc=>dcCampaignRow(bc.campaign, `<div class="cf-msg">Losing ${bc.lost_is_pct}% impression share to budget limits</div>`, 'flag', bc.message)).join('')
    : '';
  const sec2Html = `<div class="chart-card">

      ? `${e.baseline_cpa.toFixed(2)} CPA (prior ${h?h.baseline_days:''} days avg) → ${e.check_cpa.toFixed(2)} CPA (last ${h?h.check_days:''} days)`
      : `Not enough conversions to compute CPA`;
    const metrics = `<div class="cf-msg">${e.baseline_cost.toFixed(2)}/day (prior ${h?h.baseline_days:''} days avg) → ${e.check_cost.toFixed(2)}/day (last ${h?h.check_days:''} days) &nbsp;·&nbsp; ${cpaLine}</div>`;
    return dcCampaignRow(e.name, metrics, e.status, e.message);
  }).join('') || `<div class="conv-flag-empty">No campaign data.</div>`;
  const sec3Html = `<div class="chart-card">
      <h4>3. Cost / CPA Anomalies</h4>
      <div class="cc-sub">${p.cost_summary ? esc(p.cost_summary) : ''}</div>
      ${costRows}
    </div>`;

  const chartsHtml = p.trend && p.trend.length
    ? (c.business_type === 'ecommerce'
      ? `<div class="pulse-charts">
          <div class="chart-card pulse-chart-card"><h4>Conversion value by day (MTD)</h4><div class="cc-sub">Excludes today (partial day)</div><div id="dc-chart-value"></div></div>
          <div class="chart-card pulse-chart-card"><h4>ROAS by day (MTD)</h4><div class="cc-sub">Conversion value ÷ cost</div><div id="dc-chart-roas"></div></div>
        </div>`
      : `<div class="pulse-charts">
          <div class="chart-card pulse-chart-card"><h4>Conversions by day (MTD)</h4><div class="cc-sub">Excludes today (partial day)</div><div id="dc-chart-conv"></div></div>
        </div>`)
    : '';

  const recos = buildRecommendations(c);
  const recosHtml = recos.length
    ? recos.map(r=>`<div class="conv-flag-row"><div class="cf-campaign"><span class="status-chip ${RECO_SEVERITY_CHIP[r.severity]}"><span class="sdot"></span>${r.severity}</span>${esc(r.title)}</div>
        <div class="cf-msg">${esc(r.detail)}</div></div>`).join('')
    : `<div class="conv-flag-empty">No action needed — everything is within normal range. Keep monitoring.</div>`;
  const sec5Html = `<div class="chart-card">
      <h4>5. Summary &amp; Recommendations</h4>
      <div class="cf-msg" style="margin-bottom:10px;">${p.campaigns_checked||'—'} campaigns checked &nbsp;·&nbsp; ${p.total_flags!==null?p.total_flags:'—'} flag${p.total_flags===1?'':'s'} raised &nbsp;·&nbsp; Read-only, zero changes made</div>
      ${recosHtml}
    </div>`;

  body.innerHTML = headerHtml + sec1Html + sec2Html + sec3Html + chartsHtml + sec5Html;

  if(p.trend && p.trend.length){
    const currency = (p.budget && p.budget.currency) || '';
    if(c.business_type === 'ecommerce'){
      const valueEl = document.getElementById('dc-chart-value');
      if(valueEl) renderBarChart(valueEl, p.trend.map(d=>({v:d.conv_value||0, label:d.date})), {unit:currency, decimals:0});
      const roasEl = document.getElementById('dc-chart-roas');
      if(roasEl) renderBarChart(roasEl, p.trend.map(d=>({v:d.roas||0, label:d.date})), {unit:'ROAS', decimals:2});
    } else {
      const convEl = document.getElementById('dc-chart-conv');
      if(convEl) renderBarChart(convEl, p.trend.map(d=>({v:d.conv||0, label:d.date})), {unit:'conv', decimals:1});
    }
  }
}

  main.innerHTML=`<div class="home">

    <div class="kpi-row" id="kpi-row"></div>

  </div>`;

  const thisWeek = windowReports(0,7), priorWeek = windowReports(7,14);
  const dReports = thisWeek.length - priorWeek.length;
  const dNegated = sum(thisWeek,r=>r.stats.negated||0) - sum(priorWeek,r=>r.stats.negated||0);
  const cThis = cleanRate(thisWeek), cPrior = cleanRate(priorWeek);
  const dClean = (cThis!==null && cPrior!==null) ? cThis-cPrior : null;
  const daily = dailyBuckets(7);

  const kpiRow=document.getElementById('kpi-row');
  const cards = [
    {label:'Active clients', value:DATA.summary.total_clients, delta:null},
    {label:'Reports (7d)', value:thisWeek.length, delta:`${dReports>=0?'+':''}${dReports} vs prior 7d`, dir: dReports===0?null:(dReports>0?'up':'down'), spark: daily.map(b=>b.reports)},
    {label:'Negated (7d)', value:sum(thisWeek,r=>r.stats.negated||0), delta:`${dNegated>=0?'+':''}${dNegated} vs prior 7d`, dir: dNegated===0?null:(dNegated>0?'up':'down'), spark: daily.map(b=>b.negated)},
    {label:'Clean audits (7d)', value: cThis!==null?cThis+'%':'—', delta: dClean!==null?`${dClean>=0?'+':''}${dClean}pt vs prior 7d`:'no prior data', dir: dClean===null||dClean===0?null:(dClean>0?'up':'down')},
    {label:'Changes logged (all time)', value:DATA.summary.total_changes, delta:null}
  ];
  cards.forEach(k=>{
    const card=document.createElement('div');card.className='kpi-card';
    const deltaHtml = k.delta ? `<span class="kpi-delta ${k.dir||''}">${k.dir==='up'?'▲ ':k.dir==='down'?'▼ ':''}${k.delta}</span>` : '';
    card.innerHTML=`<div class="kpi-label">${k.label}</div>
      <div class="kpi-value-row"><span class="kpi-value">${k.value}</span>${deltaHtml}</div>
      ${k.spark ? '<div class="kpi-spark"></div>' : ''}`;
    kpiRow.appendChild(card);
    if(k.spark) renderSparkline(card.querySelector('.kpi-spark'), k.spark);
  });

  const grid=document.getElementById('card-grid');
  DATA.clients.forEach(c=>{
    const card=document.createElement('div');card.className='client-card';
    card.innerHTML=`<div class="cc-head"><span class="avatar" style="background:${avatarColor(c.slug)}">${initials(c.name)}</span>
        <div><h3>${esc(c.name)}</h3><div class="dom">${c.domain?esc(c.domain):(c.customer_id||'')}</div></div></div>
      ${clientHealthChip(c)}
      <div class="row"><span>Reports</span><b>${c.report_count}</b></div>
      <div class="row"><span>Last audit</span><b>${c.latest_report_date||'—'}</b></div>
      <div class="row"><span>Negated (7d)</span><b>${c.recent_negated}</b></div>
      <div class="row"><span>Last pulse-check</span>${pulseFreshnessChip(c)}</div>
      ${c.pulse ? budgetMeterHtml(c.pulse.budget, false) : ''}
      ${monthComparisonCardRows(c)}
      <div class="cc-conv-row"><span>Conversions</span>${convFlagsChip(c.pulse)}</div>`;
    card.onclick=()=>{currentSlug=c.slug;currentTab='overview';render();};
    grid.appendChild(card);
  });
}

/* ---------- detail ---------- */
function renderDetail(){
  const c=DATA.clients.find(x=>x.slug===currentSlug);
  const main=document.getElementById('main');
  const tabs=['overview','daily-check','reports','changes','scripts'];
  const dcFlags = c.pulse ? c.pulse.total_flags : null;
  const labels={overview:'Overview',
    'daily-check':`Daily Check${dcFlags?` (${dcFlags})`:''}`,
    reports:`Reports (${c.reports.length})`,changes:`Changes (${c.changes.length})`,scripts:`Scripts (${c.scripts.length})`};
  const linksHtml = c.links && Object.keys(c.links).length
    ? `<div class="quick-links">${Object.entries(c.links).map(([label,url])=>`<a class="link-chip" href="${esc(url)}" target="_blank" rel="noopener">${esc(label)} ↗</a>`).join('')}</div>`
    : '';
  main.innerHTML=`<div class="detail-head"><div class="crumb" id="back-home">← All clients</div>
    <div class="dh-title"><span class="avatar" style="background:${avatarColor(c.slug)}">${initials(c.name)}</span>
      <div><h1>${esc(c.name)}</h1><div class="sub">${c.domain?esc(c.domain)+' · ':''}${c.customer_id?'Customer ID '+c.customer_id:''}</div></div></div>
    ${linksHtml}
    <div class="tabs">${tabs.map(t=>`<div class="tab ${t===currentTab?'active':''}" data-tab="${t}">${labels[t]}</div>`).join('')}</div>
    </div><div class="tab-body" id="tab-body"></div>`;
  document.getElementById('back-home').onclick=()=>{currentSlug=null;render();};
  main.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{currentTab=t.dataset.tab;render();});
  const body=document.getElementById('tab-body');
  if(currentTab==='overview'){
    const pts = [...c.reports].filter(r=>r.type!=='full_account_audit')
      .sort((a,b)=>a.timestamp.localeCompare(b.timestamp)).slice(-8)
      .map(r=>({v:r.stats.negated||0,label:r.date.slice(5)}));
    body.innerHTML = `${pulseCardHtml(c)}${monthComparisonHtml(c)}<div class="chart-card"><h4>Negatives added per audit</h4><div class="cc-sub">Last ${pts.length} automated runs, chronological</div><div id="bar-chart"></div></div>
      <div class="md">${c.brief_markdown ? md(c.brief_markdown) : '<div class="empty">No client-brief.md found for this account.</div>'}</div>`;
    renderBarChart(document.getElementById('bar-chart'), pts);
    renderPulseCharts(c);
  } else if(currentTab==='daily-check'){renderDailyCheckTab(c,body);}
  else if(currentTab==='reports'){renderReports(c,body);}
  else if(currentTab==='changes'){renderChanges(c,body);}
  else{renderScripts(c,body);}
}
function renderReports(c,body){
  body.innerHTML=`<div class="filter-row">
      <button class="chip active" data-range="all">All time</button>
      <button class="chip" data-range="7">Last 7 days</button>
      <button class="chip" data-range="3">Last 3 days</button>
      <input class="report-search" id="report-search" placeholder="Filter by filename or type…">
    </div><div id="report-list"></div>`;
  const listEl=document.getElementById('report-list');
  let activeRange='all', activeFilter='';
  function draw(){
    const f=activeFilter.toLowerCase();
    let filtered=c.reports.filter(r=>!f||r.filename.toLowerCase().includes(f)||r.type_label.toLowerCase().includes(f));
    if(activeRange!=='all'){
      const days=parseInt(activeRange,10);
      filtered=filtered.filter(r=>daysAgo(r.date)<days);
    }
    if(!filtered.length){listEl.innerHTML='<div class="empty">No reports match this filter.</div>';return;}
    listEl.innerHTML='';
    filtered.forEach(r=>{
      const n=r.stats.negated;
      const row=document.createElement('div');row.className='report-row';
      row.innerHTML=`<span class="report-date">${r.date}</span><span class="type-tag">${esc(r.type_label)}</span><span class="report-file">${esc(r.filename)}</span>${n!==undefined?`<span class="neg-count">${n} negated</span>`:''}${statusChip(r.status)}`;
      row.onclick=()=>renderLogView(c,r,body);
      listEl.appendChild(row);
    });
  }
  draw();
  document.getElementById('report-search').addEventListener('input',e=>{activeFilter=e.target.value;draw();});
  body.querySelectorAll('.chip').forEach(chip=>{
    chip.onclick=()=>{
      body.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
      chip.classList.add('active');
      activeRange=chip.dataset.range;
      draw();
    };
  });
}
function renderChanges(c,body){
  if(!c.changes.length){ body.innerHTML = '<div class="empty">No changes logged yet for this account — nothing has written to it through this toolkit.</div>'; return; }
  body.innerHTML=`<div class="filter-row">
      <input class="report-search" id="change-search" placeholder="Filter by script, action, or term…">
    </div><div id="change-list"></div>`;
  const listEl=document.getElementById('change-list');
  function draw(f){
    f=(f||'').toLowerCase();
    const filtered=c.changes.filter(ch=>!f||[ch.script,ch.action,ch.detail,ch.resource_id,ch.reason].some(v=>v&&v.toLowerCase().includes(f)));
    if(!filtered.length){listEl.innerHTML='<div class="empty">No changes match this filter.</div>';return;}
    listEl.innerHTML='';
    filtered.forEach(ch=>{
      const row=document.createElement('div');row.className='report-row';
      const ts=ch.timestamp.replace('T',' ').slice(0,16);
      row.innerHTML=`<span class="report-date">${esc(ts)}</span><span class="type-tag">${esc(ch.action)}</span>`
        +`<span class="report-file">${esc(ch.script)}${ch.detail?' · '+esc(ch.detail):''}</span>`
        +(ch.reason?`<span class="neg-count">${esc(ch.reason)}</span>`:'');
      listEl.appendChild(row);
    });
  }
  draw();
  document.getElementById('change-search').addEventListener('input',e=>draw(e.target.value));
}
function renderLogView(c,r,body){
  body.innerHTML=`<div class="log-back" id="log-back">← Back to reports</div>
    <div style="font-size:11.5px;color:var(--text-dim);margin-bottom:8px;"><b>${esc(r.type_label)}</b> · ${esc(r.filename)} · ${fmtBytes(r.size_bytes)}</div>
    <div class="log-view">${highlightLog(r.content)}</div>`;
  document.getElementById('log-back').onclick=()=>renderDetail();
}
function renderScripts(c,body){
  if(!c.scripts.length){ body.innerHTML = '<div class="empty">No scripts found for this account.</div>'; return; }
  body.innerHTML='';
  c.scripts.forEach(s=>{
    const path = `clients/${c.slug}/scripts/${s.filename}`;
    const card=document.createElement('div');card.className='script-card';
    card.innerHTML=`<div class="sname">${esc(s.filename)}<span class="ext-badge">${s.ext}</span><button class="copy-btn" data-path="${path}">copy path</button></div><div class="shead">${esc(s.header||'(no header comment)')}</div>`;
    card.querySelector('.copy-btn').onclick=(e)=>{
      const ta=document.createElement('textarea');ta.value=path;document.body.appendChild(ta);ta.select();
      try{ document.execCommand('copy'); e.target.textContent='copied!'; setTimeout(()=>e.target.textContent='copy path',1200); } catch(err){}
      document.body.removeChild(ta);
    };
    body.appendChild(card);
  });
}

function render(){renderSidebar(document.getElementById('client-search').value);if(currentSlug){renderDetail();}else{renderHome();}}
document.getElementById('client-search').addEventListener('input',e=>renderSidebar(e.target.value));
function closeSidebarMobile(){
  if(window.innerWidth<=760){document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebar-backdrop').classList.remove('open');}
}
document.getElementById('menu-toggle').addEventListener('click',()=>{
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-backdrop').classList.toggle('open');
});
document.getElementById('sidebar-backdrop').addEventListener('click',closeSidebarMobile);
document.getElementById('generated-at').textContent = 'built ' + DATA.generated_at.replace('T',' ');
render();
</script>
</body>
</html>
