<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%2307153F%27/%3E%3Ctext x=%2716%27 y=%2721%27 font-family=%27Arial%27 font-weight=%27700%27 font-size=%2713%27 fill=%27white%27 text-anchor=%27middle%27%3E55%3C/text%3E%3C/svg%3E">
<title>55DigitalAI Team Map</title>
<!--
  55DigitalAI - team map
  Purpose  : Org-chart view of every slash command, agent prompt and optional scheduled routine in
             this toolkit, grouped into departments. Click a card for what it does, the logic step by
             step, what you give it and what you get back.
  Setup    : open team-map/index.html in a browser (double-click it, or `open team-map/index.html`).
             Local only, no build step, no data from your accounts.
  Update   : edit the DEPARTMENTS data in the script block below when a command or prompt is added.
             Keep examples generic - never put real client names, account IDs or domains in here
             (scripts/build_release.sh rejects them).
  Changelog: 2026-11-15 first version (Google Ads, SEO, Web & CRO, Setup & Automation), same layout
                        as the internal workspace team map
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#07153F; --accent:#3E5CE7; --accent-soft:#EBEFFD;
  --ink:#0E1430; --ink-2:#444751; --ink-3:#6F7176;
  --bg:#F4F7FC; --canvas:#EEF2F9; --dot:#CDD5E4; --card:#FFFFFF; --line:#DDE3EE; --wire:#9AA6BF;
  --read:#5F6470; --read-bg:#F1F3F6; --appr:#8A5A00; --appr-bg:#FEF3D6;
  --dep:#2A43B8; --dep-bg:#E6EBFC; --loc:#3F4A5E; --loc-bg:#EEF0F4; --sch:#1B6E34; --sch-bg:#E3F3E8;
  --r-s:12px; --r-m:20px; --r-l:28px;
  --font:"Onest",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:400 15px/1.45 var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
::selection{background:var(--accent);color:#fff}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}

/* Header */
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:16px;padding:8px 24px;min-height:64px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{width:32px;height:32px;border-radius:8px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.brand h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em;white-space:nowrap}
.brand p{margin:0;font-size:13px;color:var(--ink-3);white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;padding:4px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:13px;font-weight:500;color:var(--ink-2);transition:background .2s,border-color .2s,color .2s}
.chip:hover{border-color:var(--wire)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.search{flex:none;width:220px;min-height:44px;border:1px solid var(--line);border-radius:var(--r-s);padding:0 12px;font:400 16px var(--font);background:var(--bg);color:var(--ink)}
.search::placeholder{color:var(--ink-3)}

/* Legend + zoom bar */
.bar{position:fixed;left:24px;bottom:24px;z-index:15;display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 8px 4px 16px;box-shadow:0 2px 6px rgba(7,21,63,.08)}
.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--ink-3);align-items:center}
.zoom{display:flex;gap:4px;margin-left:8px;padding-left:8px;border-left:1px solid var(--line)}
.zbtn{width:44px;height:44px;border-radius:999px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--ink-2)}
.zbtn:hover{background:var(--bg)}
.zbtn svg{width:18px;height:18px}

/* Canvas */
.viewport{position:relative;height:calc(100vh - 65px);overflow:hidden;background-color:var(--canvas);background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:24px 24px;cursor:grab;touch-action:none}
.viewport.dragging{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0;padding:48px;display:flex;flex-direction:column;align-items:center;gap:56px;width:max-content}
.wires{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.wires path{fill:none;stroke:var(--wire);stroke-width:1.5}
.wires path.chain{stroke-dasharray:4 4}
.wires circle{fill:var(--wire)}
.depts{display:flex;gap:64px;align-items:flex-start}
.dept{display:flex;flex-direction:column;align-items:center;gap:48px;transition:opacity .2s}
.dept.dim{opacity:.25}
.teams{display:flex;gap:32px;align-items:flex-start}
.team{display:flex;flex-direction:column;align-items:center;gap:24px}

/* Cards */
.node{position:relative;z-index:1;display:flex;flex-direction:column;gap:8px;width:264px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:16px;cursor:pointer;box-shadow:0 2px 6px rgba(7,21,63,.05);transition:border-color .2s,box-shadow .2s,opacity .2s}
.node:hover{border-color:var(--wire);box-shadow:0 8px 24px -12px rgba(7,21,63,.25)}
.node.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.node.faded{opacity:.25}
.n-kind{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3)}
.n-kind svg{width:16px;height:16px;flex:none;color:var(--accent)}
.n-name{font-size:15px;font-weight:600;line-height:1.3;color:var(--ink);text-wrap:balance}
.n-role{font-size:13px;color:var(--ink-3);line-height:1.4;text-wrap:pretty}
.n-foot{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.n-cmd{font-size:13px;color:var(--ink-2);background:var(--bg);border-radius:8px;padding:2px 8px;max-width:100%;overflow-wrap:anywhere}
.node.lead{width:296px;border-color:#C9D2E6}
.node.lead .n-name{font-size:17px}
.node.chief{width:340px;background:var(--navy);border-color:var(--navy);color:#fff}
.node.chief .n-name{color:#fff;font-size:17px}
.node.chief .n-role,.node.chief .n-kind{color:#B9C3E0}
.node.chief .n-kind svg{color:#fff}
.node.trigger{width:300px;flex-direction:row;align-items:center;gap:12px;border-radius:999px;padding:12px 20px}
.node.team-node{width:240px;background:var(--bg);border-style:solid}

.tag{display:inline-flex;align-items:center;min-height:24px;padding:0 8px;border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap}
.t-read{color:var(--read);background:var(--read-bg)}
.t-approval{color:var(--appr);background:var(--appr-bg)}
.t-deploy{color:var(--dep);background:var(--dep-bg)}
.t-local{color:var(--loc);background:var(--loc-bg)}
.t-sched{color:var(--sch);background:var(--sch-bg)}

/* Detail panel */
.scrim{position:fixed;inset:0;background:rgba(7,21,63,.3);z-index:29;opacity:0;pointer-events:none;transition:opacity .2s}
.panel{position:fixed;top:65px;right:0;bottom:0;width:440px;max-width:100%;z-index:30;background:var(--card);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .25s ease-out;display:flex;flex-direction:column;box-shadow:-16px 0 32px -24px rgba(7,21,63,.4)}
.panel:not(.open){visibility:hidden;transition:transform .25s ease-out,visibility 0s .25s}
.panel.open{transform:none}
.p-head{display:flex;align-items:flex-start;gap:12px;padding:24px 24px 16px;border-bottom:1px solid var(--line)}
.p-head h2{margin:0;font-size:22px;line-height:1.25;letter-spacing:-.02em;text-wrap:balance;flex:1}
.p-close{width:44px;height:44px;flex:none;border:0;padding:0;border-radius:999px;background:var(--bg);cursor:pointer;display:grid;place-items:center;margin:-8px -8px 0 0}
.p-close svg{width:18px;height:18px}
.p-body{overflow-y:auto;padding:16px 24px 32px;flex:1;overscroll-behavior:contain}
.p-meta{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:16px}
.p-dept{font-size:13px;color:var(--ink-3);margin:8px 0 0}
.p-cmd{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-s);padding:4px 4px 4px 12px;margin-bottom:24px}
.p-cmd code{flex:1;min-width:0;overflow-wrap:anywhere;padding:8px 0}
.copy{min-height:44px;padding:0 16px;border-radius:999px;border:0;background:var(--navy);color:#fff;cursor:pointer;font-size:13px;font-weight:500;flex:none}
.copy:hover{background:#13245C}
.p-body h3{font-size:15px;font-weight:600;margin:24px 0 8px;letter-spacing:-.005em}
.p-body h3:first-of-type{margin-top:0}
.p-body p{margin:0;color:var(--ink-2);text-wrap:pretty}
.p-body ol,.p-body ul{margin:0;padding-left:24px;color:var(--ink-2)}
.p-body li{margin:4px 0;text-wrap:pretty}
.p-body li::marker{color:var(--ink-3)}
.p-tools{display:flex;flex-wrap:wrap;gap:4px}
.p-tools span{font-size:13px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2)}
.p-files code{display:block;margin:4px 0;color:var(--ink-2);overflow-wrap:anywhere}

/* Phones and small tablets: stacked list instead of the pan/zoom canvas */
@media (max-width:820px){
  html{scroll-padding-top:176px}
  .top-in{flex-wrap:wrap;padding:8px 16px;gap:8px}
  .brand{flex:1}
  .brand p{display:none}
  .search{width:auto;flex:1 1 100%;order:3}
  .chips{flex:1 1 100%;order:4;margin:0 -16px;padding:0 16px 4px}
  .viewport{height:auto;overflow:visible;cursor:default;touch-action:auto}
  .world{position:static;transform:none!important;width:auto;padding:24px 16px 120px;gap:24px;align-items:stretch}
  .wires{display:none}
  .depts,.teams{flex-direction:column;gap:24px;align-items:stretch}
  .dept{align-items:stretch;gap:16px;padding-top:24px;border-top:1px solid var(--line);scroll-margin-top:160px}
  .team{align-items:stretch;gap:8px}
  .node,.node.lead,.node.chief,.node.trigger,.node.team-node{width:100%}
  .node.trigger{border-radius:var(--r-m)}
  .dept.dim{opacity:1}
  .bar{position:static;margin:16px 16px 0;border-radius:var(--r-m);padding:8px 16px;box-shadow:none}
  .zoom{display:none}
  .panel{top:auto;left:0;width:100%;height:85vh;border-left:0;border-top:1px solid var(--line);border-radius:var(--r-l) var(--r-l) 0 0;transform:translateY(100%)}
  .scrim.on{opacity:1;pointer-events:auto}
  .p-head{padding:16px 16px 16px 24px}
  .p-body{padding:16px 24px calc(32px + env(safe-area-inset-bottom))}
}
@media (prefers-reduced-motion:reduce){
  .panel{transition:opacity .2s}
  .panel:not(.open){opacity:0}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">55</div>
      <div>
        <h1>55DigitalAI Team Map</h1>
        <p id="stats"></p>
      </div>
    </div>
    <nav class="chips" id="chips" aria-label="Departments"></nav>
    <input class="search" id="search" type="search" placeholder="Search agents or commands" aria-label="Search agents or commands">
  </div>
</header>

<div class="bar">
  <div class="legend" aria-label="Legend">
    <span class="tag t-read">Read-only</span>
    <span class="tag t-approval">Writes after approval</span>
    <span class="tag t-deploy">Deploys</span>
    <span class="tag t-local">Local files</span>
    <span class="tag t-sched">Can be scheduled</span>
  </div>
  <div class="zoom">
    <button class="zbtn" id="zout" aria-label="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
    <button class="zbtn" id="zin" aria-label="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="zbtn" id="zfit" aria-label="Fit everything"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
</div>

<main class="viewport" id="viewport">
  <div class="world" id="world">
    <svg class="wires" id="wires" aria-hidden="true"></svg>
  </div>
</main>

<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel" aria-hidden="true" aria-labelledby="p-title">
  <div class="p-head">
    <div style="flex:1;min-width:0">
      <h2 id="p-title"></h2>
      <p class="p-dept" id="p-dept"></p>
    </div>
    <button class="p-close" id="p-close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="p-body" id="p-body"></div>
</aside>

<script>
/* ---------- Icons (one line style) ---------- */
const ICON = {
  web:'<path d="M3 5h18v14H3z"/><path d="M3 9h18"/><path d="M7 7h.01M10 7h.01"/>',
  seo:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>',
  gads:'<path d="M4 19l6-14M10 5l6 14"/><circle cx="18" cy="17" r="2"/>',
  setup:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/>',
  chief:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',
  bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
  team:'<circle cx="9" cy="9" r="3"/><circle cx="17" cy="10" r="2.5"/><path d="M3 20c.8-3 3-5 6-5s5.2 2 6 5M15 15.5c2.5-.3 5 1 6 4.5"/>'
};
const svg = (k) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' + ICON[k] + '</svg>';

const WRITES = {
  read:['t-read','Read-only'], approval:['t-approval','Writes after approval'],
  deploy:['t-deploy','Deploys'], local:['t-local','Local files']
};
const KIND = {command:'Slash command', prompt:'Agent prompt', automation:'Automation', script:'Script', lead:'Department lead', team:'Team', chief:'Orchestrator', trigger:'Entry point'};

/* ---------- Data ----------
   Keep every example generic: no real client names, account IDs or domains. */
const TRIGGER = {
  id:'trigger', name:'Request comes in', kind:'trigger',
  role:'Chat message, /command or an optional schedule',
  what:'Every piece of work starts here: you type a request or a slash command in Claude Code, or a scheduled job you installed fires on its own (keyword audits, PMax audits, daily checks, dashboard rebuild).',
  logic:['You write a task in chat, or type a slash command like /55-daily-check <slug>.','Or a scheduled job starts by itself (only if you set one up, see the green tags).','The request goes to the Operations Lead, who routes it to the right department.'],
  input:'A client slug from clients.json, a URL or a free-text question.',
  output:['The task is routed to one department and one agent.'],
  files:['.claude/commands/*.md','SCHEDULING.md'],
  tools:['Claude Code','launchd / Task Scheduler / cron']
};
const CHIEF = {
  id:'chief', name:'Claude - Operations Lead', kind:'chief',
  role:'Reads the client config, picks the agent, asks before any write',
  what:'Orchestrates the whole toolkit. Before acting it reads the client registry and the client brief, then hands the task to the right department and agent.',
  logic:[
    'Load context: clients.json through scripts/client_registry.py (customer ID, business type, GA4, Merchant Center, negative list IDs) and clients/<slug>/client-brief.md.',
    'Route the task to a department and run the matching slash command.',
    'Every write-capable script defaults to dry-run; nothing changes without --confirm.',
    'Before any write to a live account: show the full proposed change list and wait for your approval.',
    'Every real write is logged to change_log.py, so you can always see what was changed.'
  ],
  input:'The routed request.',
  output:['Result in chat, plus files, PDFs or a dashboard depending on the agent.'],
  files:['clients.json','scripts/client_registry.py','clients/<slug>/client-brief.md','scripts/change_log.py','brand_config.json'],
  tools:['Claude Code','Google Ads API','GA4','Merchant Center','Playwright']
};

const DEPARTMENTS = [
{
  id:'gads', name:'Google Ads', icon:'gads',
  lead:{ name:'Google Ads Lead', role:'Every client account in clients.json',
    what:'Runs Google Ads for your clients through the Google Ads API: monitoring, keywords, PMax and Shopping, GA4 analytics and reporting.',
    logic:['Query each client account by its own customer ID, never the MCC for metrics.','Read the client brief before any judgement.','Show the exact change list and wait for approval before any account write.','Recommendations name real campaigns, keywords and metrics from the account.'],
    output:['Chat reports','Branded PDFs','Local dashboard','Negative keyword lists'], tools:['Google Ads API','GA4','Merchant Center'] },
  groups:[
  { name:'Monitoring & Reporting', what:'Watches the accounts and turns the numbers into audits, dashboards and reports.', agents:[
    { id:'daily', name:'Daily Pulse Check', kind:'command', cmd:'/55-daily-check <slug>', writes:'read', schedule:'Optional daily run (setup_launchd.py)',
      role:'Tracking, pacing, impression share and CPA anomalies',
      what:'Fast read-only health check of one account. Strictly read-only: if a fix is needed it says what to check next, not what to change.',
      logic:['Conversion tracking: flags a drop to zero against a real baseline (highest priority).','Budget pacing, plus an impression-share split per Search campaign (budget- vs rank-limited).','Cost and CPA anomalies over the last days vs a trailing baseline.','Public holidays are noted as context, not hidden.','A clean result is reported briefly, no invented concerns.'],
      input:'Client slug.', output:['Findings in chat, most urgent first','Optional PDF (--pdf)'],
      files:['.claude/commands/55-daily-check.md','scripts/daily_check.py','scripts/run_daily_checks_all.sh'], tools:['Google Ads API'] },
    { id:'full', name:'Full Account Auditor', kind:'command', cmd:'/55-full-audit <slug>', writes:'read',
      role:'20-section account audit with a health score',
      what:'Comprehensive audit: structure, tracking, settings, bid strategy, competitors, GA4, Merchant Center, feeds, audiences, keywords, budgets, website and Search / DSA / Shopping / PMax / Display / YouTube deep dives. Active campaigns only, 90-day default lookback.',
      logic:['Step 0: check what this session can actually reach (customer ID, GA4, Search Console, Merchant Center) before pulling data.','Work through the 20-section checklist in ppc-audit-agent.md.','Unreachable sources are listed as gaps, never guessed as Pass or Fail.','Text report first: executive summary, health score, findings, priorities, action checklist.','Offer the branded PDF only after the text report is delivered.'],
      input:'Client slug.', output:['Full audit in chat','full_account_audit_<date>.json','Branded PDF (generate_audit_pdf.py)'],
      files:['.claude/commands/55-full-audit.md','system-prompts/agents/ppc-audit-agent.md','scripts/check_extended_access.py','scripts/generate_audit_pdf.py'], tools:['Google Ads API','GA4','Merchant Center','PDF'] },
    { id:'season', name:'Seasonality Analyst', kind:'command', cmd:'/seasonality <slug> [month]', writes:'read',
      role:'Seasonal dip or a real problem?',
      what:'Year-over-year analysis at 4 levels: campaigns, product types, brands and individual products. Needs about 13 months of history; levels 2-4 need a Shopping/PMax feed.',
      logic:['Pull the target month, the month before, and the same pair last year.','Compare at each available level.','Refuse to fake a shorter window when history is missing.','Separate a normal seasonal dip from a real account problem.'],
      input:'Client slug, optional target month.', output:['YoY tables and verdict in chat','Optional PDF (--pdf)'],
      files:['.claude/commands/seasonality.md','scripts/seasonality.py'], tools:['Google Ads API'] },
    { id:'dash', name:'Dashboard Builder', kind:'command', cmd:'/update-dashboard', writes:'deploy', schedule:'Optional hourly run (setup_launchd.py)',
      role:'Rebuilds the agency dashboard',
      what:'Regenerates dashboard/index.html from client briefs, reports and scripts. If you add your own deploy script and host credentials, it also uploads the hosted copy and checks it returns 200.',
      logic:['run_dashboard_build.sh rebuilds dashboard/index.html.','If scripts/deploy_dashboard.sh and credentials exist, upload the hosted copy; otherwise say only the local file updated.','Report client and report counts from the build.'],
      input:'Nothing.', output:['dashboard/index.html','Hosted copy, if configured'],
      files:['.claude/commands/update-dashboard.md','scripts/build_dashboard.py','scripts/dashboard_template.html','scripts/run_dashboard_build.sh'], tools:['Google Ads API'] }
  ]},
  { name:'Search & Keywords', what:'Finds new keywords and blocks wasted search terms.', agents:[
    { id:'kwres', name:'Keyword Researcher', kind:'command', cmd:'/55-keyword-research <slug> <terms>', writes:'read',
      role:'Keyword Planner in the terminal',
      what:'Search volume, competition, CPC and a 12-month trend for a list of terms, cross-checked against the account keywords. Similar keyword ideas are included by default.',
      logic:['Geo and language come from the client country in the registry.','Get metrics for each term plus Keyword Planner ideas seeded from them.','Flag each term [IN ACCOUNT] or [NEW].','Lead with new terms that have real volume and low or medium competition.'],
      input:'Client slug and a list of terms.', output:['Volume / CPC / trend table in chat'],
      files:['.claude/commands/55-keyword-research.md','scripts/keyword_research.py'], tools:['Google Ads API'] },
    { id:'kwexp', name:'Keyword Expander', kind:'command', cmd:'/55-keyword-expansion <slug>', writes:'approval',

function tagsHtml(a){

}

/* ---------- Wires (computed from the real card positions) ---------- */
function box(el){
  const w = world.getBoundingClientRect(), r = el.getBoundingClientRect(), s = view.s;
  return { x:(r.left - w.left)/s, y:(r.top - w.top)/s, w:r.width/s, h:r.height/s };
}
function elbow(a, b, cls){
  const x1 = a.x + a.w/2, y1 = a.y + a.h, x2 = b.x + b.w/2, y2 = b.y;
  const ym = y1 + (y2 - y1)/2;
  const d = Math.abs(x2 - x1) < 1 ? 'M' + x1 + ' ' + y1 + 'V' + y2
    : 'M' + x1 + ' ' + y1 + 'V' + ym + 'H' + x2 + 'V' + y2;
  return '<path ' + (cls ? 'class="' + cls + '" ' : '') + 'd="' + d + '"/><circle cx="' + x2 + '" cy="' + y2 + '" r="3"/>';
}
function drawWires(){
  if (isMobile()) return;
  wires.setAttribute('width', world.offsetWidth); wires.setAttribute('height', world.offsetHeight);
  let h = elbow(box(top1), box(chiefEl));
  const cb = box(chiefEl);
  document.querySelectorAll('.dept').forEach(sec => {
    const lb = box(sec.querySelector('.node.lead'));
    h += elbow(cb, lb);
    sec.querySelectorAll('.team').forEach(t => {
      const nodes = t.querySelectorAll('.node');
      h += elbow(lb, box(nodes[0]));
      for (let i = 1; i < nodes.length; i++) h += elbow(box(nodes[i-1]), box(nodes[i]), 'chain');
    });
  });
  wires.innerHTML = h;
}

/* ---------- Pan and zoom ---------- */
const view = { x:0, y:0, s:1 };
const isMobile = () => window.matchMedia('(max-width:820px)').matches;
function apply(){ if (!isMobile()) world.style.transform = 'translate(' + view.x + 'px,' + view.y + 'px) scale(' + view.s + ')'; }
function fitTo(el, maxS){
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  const b = el === world ? { x:0, y:0, w:world.offsetWidth, h:world.offsetHeight } : box(el);
  const s = Math.min((vw - 48) / b.w, (vh - 120) / b.h, maxS || 1);
  view.s = Math.max(.2, s);
  view.x = (vw - b.w * view.s) / 2 - b.x * view.s;
  view.y = 24 - b.y * view.s;
  apply();
}
function zoomAt(f, cx, cy){
  const ns = Math.min(1.6, Math.max(.2, view.s * f));
  view.x = cx - (cx - view.x) * ns / view.s; view.y = cy - (cy - view.y) * ns / view.s; view.s = ns; apply();
}
let drag = null, moved = false;
viewport.addEventListener('pointerdown', e => {
  if (isMobile() || e.button !== 0) return;
  drag = { x:e.clientX, y:e.clientY, vx:view.x, vy:view.y }; moved = false;
});
window.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!moved && Math.hypot(dx, dy) > 5){ moved = true; viewport.classList.add('dragging'); }
  if (moved){ view.x = drag.vx + dx; view.y = drag.vy + dy; apply(); }
});
window.addEventListener('pointerup', () => { drag = null; viewport.classList.remove('dragging'); setTimeout(() => moved = false, 0); });
viewport.addEventListener('wheel', e => {
  if (isMobile()) return;
  e.preventDefault();
  const r = viewport.getBoundingClientRect();
  if (e.ctrlKey || e.metaKey) zoomAt(Math.exp(-e.deltaY * .01), e.clientX - r.left, e.clientY - r.top);
  else { view.x -= e.deltaX; view.y -= e.deltaY; apply(); }
}, { passive:false });
document.getElementById('zin').onclick = () => zoomAt(1.2, viewport.clientWidth/2, viewport.clientHeight/2);
document.getElementById('zout').onclick = () => zoomAt(1/1.2, viewport.clientWidth/2, viewport.clientHeight/2);
document.getElementById('zfit').onclick = () => { setChip('all'); fitTo(world, 1); };

/* ---------- Department chips ---------- */
const chips = document.getElementById('chips');
[{id:'all', name:'All departments'}].concat(DEPARTMENTS).forEach(d => {
  const b = document.createElement('button'); b.className = 'chip'; b.type = 'button';
  b.textContent = d.name; b.dataset.id = d.id; b.setAttribute('aria-pressed', d.id === 'all' ? 'true' : 'false');
  b.onclick = () => {
    setChip(d.id);
    if (isMobile()){
      if (d.id === 'all') window.scrollTo({ top:0, behavior:'smooth' });
      else document.getElementById('dept-' + d.id).scrollIntoView({ behavior:'smooth', block:'start' });
      return;
    }
    if (d.id === 'all') fitTo(world, 1); else fitTo(document.getElementById('dept-' + d.id), 1);
  };
  chips.appendChild(b);
});
function setChip(id){
  chips.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.id === id ? 'true' : 'false'));
  document.querySelectorAll('.dept').forEach(s => s.classList.toggle('dim', id !== 'all' && s.id !== 'dept-' + id));
}

/* ---------- Search ---------- */
document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll('.node.agent').forEach(n => {
    const a = byId[n.dataset.id];
    const hay = [a.name, a.role, a.cmd, a.what, a.dept].join(' ').toLowerCase();
    n.classList.toggle('faded', !!q && !hay.includes(q));
  });
});

/* ---------- Detail panel ---------- */
const panel = document.getElementById('panel'), scrim = document.getElementById('scrim');
function list(items, ordered){
  if (!items || !items.length) return '';
  const tag = ordered ? 'ol' : 'ul';
  return '<' + tag + '>' + items.map(i => '<li>' + esc(i) + '</li>').join('') + '</' + tag + '>';
}
function openPanel(id){
  const a = byId[id]; if (!a) return;
  document.querySelectorAll('.node.sel').forEach(n => n.classList.remove('sel'));
  const el = document.querySelector('.node[data-id="' + id + '"]'); if (el) el.classList.add('sel');
  document.getElementById('p-title').textContent = a.name;
  document.getElementById('p-dept').textContent = a.dept + (a.kind ? ' - ' + (KIND[a.kind] || '') : '');
  let h = '';
  const meta = (a.writes ? '<span class="tag ' + WRITES[a.writes][0] + '">' + WRITES[a.writes][1] + '</span>' : '') +
    (a.schedule ? '<span class="tag t-sched">' + esc(a.schedule) + '</span>' : '');
  if (meta) h += '<div class="p-meta">' + meta + '</div>';
  if (a.cmd) h += '<div class="p-cmd"><code>' + esc(a.cmd) + '</code><button class="copy" type="button" data-copy="' + esc(a.cmd) + '">Copy</button></div>';
  h += '<h3>What it does</h3><p>' + esc(a.what) + '</p>';
  if (a.logic && a.logic.length) h += '<h3>' + (a.kind === 'team' ? 'Agents in this team' : 'How it works') + '</h3>' + list(a.logic, a.kind !== 'team');
  if (a.input) h += '<h3>You give it</h3><p>' + esc(a.input) + '</p>';
  if (a.output && a.output.length) h += '<h3>You get</h3>' + list(a.output);
  if (a.files && a.files.length) h += '<h3>Files</h3><div class="p-files">' + a.files.map(f => '<code>' + esc(f) + '</code>').join('') + '</div>';
  if (a.tools && a.tools.length) h += '<h3>Tools</h3><div class="p-tools">' + a.tools.map(t => '<span>' + esc(t) + '</span>').join('') + '</div>';
  const body = document.getElementById('p-body'); body.innerHTML = h; body.scrollTop = 0;
  panel.classList.add('open'); panel.setAttribute('aria-hidden', 'false');
  if (isMobile()){ scrim.classList.add('on'); document.body.style.overflow = 'hidden'; }
  document.getElementById('p-close').focus({ preventScroll:true });
}
function closePanel(){
  panel.classList.remove('open'); panel.setAttribute('aria-hidden', 'true'); scrim.classList.remove('on');
  document.body.style.overflow = '';
  document.querySelectorAll('.node.sel').forEach(n => n.classList.remove('sel'));
}
world.addEventListener('click', e => {
  if (moved) return;
  const n = e.target.closest('.node'); if (n) openPanel(n.dataset.id);
});
document.getElementById('p-close').onclick = closePanel;
scrim.onclick = closePanel;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
document.getElementById('p-body').addEventListener('click', e => {
  const b = e.target.closest('.copy'); if (!b) return;
  const done = () => { b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy', 1200); };
  if (navigator.clipboard) navigator.clipboard.writeText(b.dataset.copy).then(done, done); else done();
});

/* ---------- Init ---------- */
function layout(){ if (isMobile()){ world.style.transform = ''; } else { const s = view.s; view.s = 1; world.style.transform = 'none'; drawWires(); view.s = s; apply(); } }
function init(){ view.s = 1; world.style.transform = 'none'; drawWires(); if (!isMobile()) fitTo(world, 1); }
init();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { const keep = { ...view }; view.s = 1; world.style.transform = 'none'; drawWires(); Object.assign(view, keep); apply(); });
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(layout, 150); });
</script>
</body>
</html>
